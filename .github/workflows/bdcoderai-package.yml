# BDCoderAI IDE - installer packaging from existing compile artifact
# Creator: Jamil | Team: BDCoderAI
# Reuses the "vscode" artifact from run 35107900520 (compile done) - skips 45min compile.
# Mirrors the real VSCodium CI flow: prepare_vscode.sh (rebrand/iss/includes) then
# build/windows/package.sh (mixin/min-packing/cli) then prepare_assets.sh (iss compile -> assets/*.exe)

name: BDCoderAI Package Installer

on:
  workflow_dispatch:

env:
  APP_NAME: BDCoderAI
  BINARY_NAME: bdcoderai
  GH_REPO_PATH: ${{ github.repository }}
  ORG_NAME: ${{ github.repository_owner }}
  OS_NAME: windows
  VSCODE_QUALITY: stable
  DISABLE_UPDATE: yes

permissions: {}

jobs:
  package:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      VSCODE_ARCH: 'x64'
      CI_BUILD: yes
      BUILD_SOURCEVERSION: f0c34bfaf48230bb6b3330f1f33ec7ec17a6d003
      MS_COMMIT: 08d4889f9ec4a1685d257b9b95de036c8e1ce1e5
      MS_TAG: '1.135.0'
      RELEASE_VERSION: 1.135.06229
      SHOULD_BUILD_ZIP: no
      SHOULD_BUILD_EXE_SYS: yes
      SHOULD_BUILD_EXE_USR: no
      SHOULD_BUILD_MSI: no
      SHOULD_BUILD_MSI_NOUP: no
      SHOULD_BUILD_REH: no
      SHOULD_BUILD_REH_WEB: no
      SHOULD_BUILD_CLI: no

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download compile artifact from previous run
        uses: actions/download-artifact@v4
        with:
          name: vscode
          run-id: 35107900520
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract vscode artifact
        run: tar -xzf vscode.tar.gz

      # Re-create the rebranded/patched source tree (iss, includes/vscodium-variables.wxi, icons, etc.)
      - name: Repair Inno/MSI include files
        run: |
          set -e
          # The compile artifact was produced by build.sh which already ran prepare_vscode.sh,
          # so vscode/ source already carries the BDCoderAI rebrand. Re-running prepare_vscode.sh
          # would fail (patches already applied). We only ensure the Inno Setup include exists.
          mkdir -p vscode/build/win32/includes
          if [ ! -f vscode/build/win32/includes/vscodium-variables.wxi ]; then
            cp -f build/windows/msi/includes/vscodium-variables.wxi vscode/build/win32/includes/vscodium-variables.wxi
          fi
          # substitute a stable upgrade code so upgrades behave (any fixed GUID works)
          sed -i 's|{@@PRODUCT_UPGRADE_CODE@@}|{8F1B0A31-9C2D-4E77-A5B6-2D3C41E9F001}|g' vscode/build/win32/includes/vscodium-variables.wxi || true
          ls -la vscode/build/win32/includes/

      # Package: mixin npm, rtf, policies, min-packing (no compile of TS needed - artifact has it)
      - name: Build installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: x64
          npm_config_target_arch: x64
        run: |
          npm_config_arch=x64 npm_config_target_arch=x64 ./build/windows/package.sh

      # GUARANTEED built-in injection: after min-packing the app tree is fully assembled,
      # so we drop our chat extension straight into resources/app/extensions/. VS Code scans
      # this folder at startup and auto-loads every subfolder as a built-in extension.
      - name: Inject BDCoderAI built-in chat extension into app tree
        run: |
          set -e
          APPEXT=""
          for cand in \
            "VSCode-win32-x64/resources/app/extensions" \
            "vscode/.build/win32-x64/VSCode-win32-x64/resources/app/extensions" \
            "vscode/.build/win32-x64/resources/app/extensions" ; do
            if [ -d "$cand" ]; then APPEXT="$cand"; break; fi
          done
          echo "App extensions dir: ${APPEXT:-NOT FOUND}"
          if [ -z "$APPEXT" ]; then
            echo "Searching for app extensions dir..."; find . -type d -path '*resources/app/extensions' 2>/dev/null | head -5
            APPEXT="$(find . -type d -path '*resources/app/extensions' 2>/dev/null | head -1)"
          fi
          [ -n "$APPEXT" ] || { echo 'FATAL: app extensions dir not found'; exit 1; }
          rm -rf "$APPEXT/bdcoderai"
          mkdir -p "$APPEXT/bdcoderai"
          cp -rf bdcoderai-extension/. "$APPEXT/bdcoderai/"
          rm -rf "$APPEXT/bdcoderai/tmp-protoc" "$APPEXT/bdcoderai/node_modules" || true
          echo "--- injected files ---"; ls -la "$APPEXT/bdcoderai" | head -20
          node -e "const p=require('./$APPEXT/bdcoderai/package.json'); console.log('INJECTED:', p.publisher+'.'+p.name, 'main='+p.main, 'activation='+JSON.stringify(p.activationEvents))"
          echo "--- verify present ---"; test -d "$APPEXT/bdcoderai" && echo "OK: builtin chat extension embedded"

      # Compile Inno Setup scripts -> assets/*.exe
      - name: Compile installer assets
        run: |
          mkdir -p assets
          ./build/windows/prepare_assets.sh

      - name: List assets
        run: ls -la assets

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BDCoderAI-Setup-x64
          path: assets/
          retention-days: 7

