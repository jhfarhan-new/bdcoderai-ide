# BDCoderAI IDE - Windows installer build
# Creator: Jamil | Team: BDCoderAI
# Based on VSCodium ci-build-windows.yml, adapted: x64 only, NSIS system-setup .exe only,
# built-in BDCoderAI extension injected after compile.

name: BDCoderAI IDE Build (Windows)

on:
  workflow_dispatch:

env:
  APP_NAME: BDCoderAI
  BINARY_NAME: bdcoderai
  GH_REPO_PATH: ${{ github.repository }}
  ORG_NAME: ${{ github.repository_owner }}
  OS_NAME: windows
  VSCODE_QUALITY: stable
  DISABLE_UPDATE: yes

permissions: {}

jobs:
  compile:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      VSCODE_ARCH: 'x64'
    outputs:
      BUILD_SOURCEVERSION: ${{ env.BUILD_SOURCEVERSION }}
      MS_COMMIT: ${{ env.MS_COMMIT }}
      MS_TAG: ${{ env.MS_TAG }}
      RELEASE_VERSION: ${{ env.RELEASE_VERSION }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone VSCode repo
        run: ./get_repo.sh

      - name: Build
        env:
          SHOULD_BUILD: yes
          SHOULD_BUILD_REH: no
          SHOULD_BUILD_REH_WEB: no
        run: ./build.sh

      - name: Inject BDCoderAI built-in extension
        run: |
          cp -r bdcoderai-extension vscode/extensions/bdcoderai
          ls vscode/extensions/bdcoderai

      - name: Compress vscode artifact
        run: |
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          echo "vscode/.git" >> vscode.txt
          tar -czf vscode.tar.gz -T vscode.txt

      - name: Upload vscode artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: ./vscode.tar.gz
          retention-days: 1

  build:
    needs:
      - compile
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      MS_COMMIT: ${{ needs.compile.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.compile.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.compile.outputs.RELEASE_VERSION }}
      SHOULD_BUILD_REH: no
      SHOULD_BUILD_REH_WEB: no
      VSCODE_ARCH: 'x64'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download vscode artifact
        uses: actions/download-artifact@v4
        with:
          name: vscode

      - name: Extract vscode artifact
        run: tar -xzf vscode.tar.gz

      - name: Repair Inno/MSI include files
        run: |
          set -e
          mkdir -p vscode/build/win32/includes
          if [ ! -f vscode/build/win32/includes/vscodium-variables.wxi ]; then
            cp -f build/windows/msi/includes/vscodium-variables.wxi vscode/build/win32/includes/vscodium-variables.wxi
          fi
          sed -i 's|{@@PRODUCT_UPGRADE_CODE@@}|{8F1B0A31-9C2D-4E77-A5B6-2D3C41E9F001}|g' vscode/build/win32/includes/vscodium-variables.wxi || true
          ls -la vscode/build/win32/includes/

      - name: Build installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOULD_BUILD_ZIP: no
          SHOULD_BUILD_EXE_SYS: yes
          SHOULD_BUILD_EXE_USR: no
          SHOULD_BUILD_MSI: no
          SHOULD_BUILD_MSI_NOUP: no
          npm_config_arch: x64
          npm_config_target_arch: x64
        run: ./build/windows/package.sh

      # Safety net: guarantee the built-in BDCoderAI chat extension is present in the
      # packaged app tree (min-packing may not include post-compile injected extensions).
      - name: Ensure BDCoderAI extension in app tree
        run: |
          set -e
          APP="VSCode-win32-x64/resources/app"
          if [ -d "$APP" ]; then
            mkdir -p "$APP/extensions"
            rm -rf "$APP/extensions/bdcoderai"
            cp -r bdcoderai-extension "$APP/extensions/bdcoderai"
            echo "--- extension-injected ---"
            ls "$APP/extensions/bdcoderai"
            echo "--- webview-ui/build ---"
            ls -la "$APP/extensions/bdcoderai/webview-ui/build" || true
            echo "--- webview-ui/build/assets ---"
            ls -la "$APP/extensions/bdcoderai/webview-ui/build/assets" || true
          else
            echo "App tree not found at $APP"; ls -la; exit 0
          fi

      # Re-run just the packaging of the installer after injecting the extension.
      - name: Repackage installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOULD_BUILD_ZIP: no
          SHOULD_BUILD_EXE_SYS: yes
          SHOULD_BUILD_EXE_USR: no
          SHOULD_BUILD_MSI: no
          SHOULD_BUILD_MSI_NOUP: no
          npm_config_arch: x64
          npm_config_target_arch: x64
        run: |
          mkdir -p assets
          ./build/windows/prepare_assets.sh

      - name: List assets
        run: ls -la assets

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BDCoderAI-Setup-x64
          path: assets/
          retention-days: 7
